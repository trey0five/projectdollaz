<!doctype html>
<meta charset="utf-8"><title>KYRO dove sprite preview</title>
<style>
  body{margin:0;font:13px/1.4 system-ui,sans-serif;color:#1f3d72;background:#fff}
  .row{display:flex;gap:40px;align-items:flex-end;padding:28px 32px;flex-wrap:wrap}
  .light{background:#f6f7fb} .navy{background:#1f3d72;color:#fff}
  .fly{width:256px;height:205px;background:url(fly.webp) 0 0/2048px 1025px no-repeat;
       animation:fx 0.33333s steps(8) infinite, fy 1.66667s steps(5) infinite}
  @keyframes fx{to{background-position-x:-2048px}}
  @keyframes fy{to{background-position-y:-1025px}}
  .mirror{transform:scaleX(-1)}
  .box{position:relative;display:inline-block}
  .anchor{position:absolute;width:9px;height:9px;margin:-5px 0 0 -5px;border-radius:50%;background:#ff5a5f;box-shadow:0 0 0 2px #fff;pointer-events:none}
  .label{display:block;margin-top:6px;opacity:.7}
  img{display:block}
</style>
<div class="row light">
  <div><span class="box"><div class="fly"></div><i class="anchor" style="left:51.87%;top:77.24%"></i></span><span class="label">fly.webp 40 cells @ 24 fps (facing right)</span></div>
  <div><span class="box"><div class="fly mirror"></div></span><span class="label">scaleX(-1)</span></div>
  <div><span class="box"><img src="glide.webp" width="256" height="205"><i class="anchor" style="left:51.87%;top:77.24%"></i></span><span class="label">glide.webp</span></div>
  <div><span class="box"><img src="perched@256.webp" width="225" height="256"><i class="anchor" style="left:68.10%;top:95.90%"></i></span><span class="label">perched@256.webp</span></div>
  <div><span class="box"><img src="perched.webp" width="225" height="256"></span><span class="label">perched.webp shown at 50%</span></div>
</div>
<div class="row navy">
  <div><span class="box"><div class="fly"></div></span><span class="label">fly.webp</span></div>
  <div><span class="box"><div class="fly mirror"></div></span><span class="label">scaleX(-1)</span></div>
  <div><span class="box"><img src="glide.webp" width="256" height="205"></span><span class="label">glide.webp</span></div>
  <div><span class="box"><img src="perched@256.webp" width="225" height="256"></span><span class="label">perched@256.webp</span></div>
</div>
<div class="row light" style="padding-top:8px"><span>Red dots = manifest anchors (fly/glide: body centroid; perched: feet).</span></div>
