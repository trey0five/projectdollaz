<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>KYRO v4 — c0_meet</title>
<link rel="stylesheet" href="rig.css">
<style>
  #hero { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #lockup { position: absolute; left: 0; top: 0; width: 1254px; height: 1254px; transform-origin: 0 0; }
  #clean { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="clean"><canvas id="bg" class="full" width="1920" height="1080"></canvas><img id="lockup" src="/apps/web/public/kyro-logo.png" alt=""></div>
  <img id="hero" alt="">
  <div id="owls" class="layer"></div>
</div>
<script type="module">
import { boot } from './lib/stage.js'
import { loadVO } from './lib/timing.js'
import { createFilmOwl, flightPhase, moodAt } from './lib/owl.js'
import { paintNavy, paintMotes } from './lib/ribbons.js'
import { keyPath, ramp, lin, lerp, easeInOut, FPS } from './lib/util.js'

// The homescreen video (assets/hero-v3-1080.mp4, 1080p30) from V0 to its last
// frame, frames pre-extracted by render-all.sh to out/.hero/hNNN.jpg (NNN = the
// video's own frame index). Its S6 shot: ribbons → the petal bloom (~8.43 s)
// → the KYRO lockup, while the camera pulls back over a shoulder.
const V0 = 210 // first video frame used (7.0 s)
const VLAST = 299
// The clean lockup (kyro-logo.png) fitted to the video's logo on frames 280/290/299
// (colour-mask bbox fit: scale, left, top) so the dissolve lands on the same picture.
const FIT = [
  [280, 0.5332, 664.0, 155.1],
  [290, 0.518, 673.4, 166.4],
  [299, 0.5085, 680.2, 173.3],
]
const FINAL = { s: 0.56, left: 651, top: 199 }
const fitAt = (n) => {
  if (n <= FIT[0][0]) return FIT[0].slice(1)
  for (let i = 0; i < FIT.length - 1; i++) {
    const [a, ...A] = FIT[i]
    const [b, ...Bv] = FIT[i + 1]
    if (n <= b) return A.map((v, k) => lerp(v, Bv[k], (n - a) / (b - a)))
  }
  return FIT[FIT.length - 1].slice(1)
}

boot(async ({ alpha, q }) => {
  const vo = await loadVO('c0_meet', { minSec: 7 })
  const $ = (id) => document.getElementById(id)
  const hero = $('hero')
  const bg = $('bg').getContext('2d')
  const heroDir = q.hero || '/demo-video/scholar-v4/out/.hero'
  const T = { until: vo.beat('until'), meet: vo.beat('meet'), cairo: vo.beat('cairo') }
  const VEND = (VLAST - V0 + 1) / FPS // 3.0 s of video
  const DIS0 = VEND - 0.65 // dissolve to the clean lockup
  const DIS1 = VEND - 0.05
  const SETTLE1 = VEND + 0.85
  const BORN = (254 - V0) / FPS // the first frame of the bloom
  const LAND = 3.55
  // perch: the left end of the open book in the FINAL lockup (logo px 118, 838)
  const PERCH = { x: FINAL.left + 118 * FINAL.s, y: FINAL.top + 838 * FINAL.s }
  const OWL = 232
  const path = keyPath([
    { t: BORN, x: 948, y: 506, size: 12 },
    { t: BORN + 0.38, x: 1150, y: 340, size: 118 },
    { t: BORN + 0.85, x: 1430, y: 300, size: 214 },
    { t: BORN + 1.3, x: 1330, y: 540, size: 250 },
    { t: BORN + 1.72, x: 960, y: 720, size: 244 },
    { t: LAND, x: PERCH.x, y: PERCH.y, size: OWL },
  ])
  const fly = flightPhase(path, BORN, LAND, 0.3)
  const moods = [{ t: LAND + 0.45, name: 'hello' }]
  const owl = createFilmOwl($('owls'), {
    uid: 'meet',
    baseSize: OWL,
    seed: 3,
    script: (t) => {
      if (t < BORN) return { ...path.at(BORN), phase: 'flying', opacity: 0, facing: 1 }
      const f = fly(t)
      if (f) return { ...f, opacity: ramp(t, BORN, BORN + 0.12), filter: t < BORN + 0.3 ? `brightness(${(1 + 1.2 * (1 - ramp(t, BORN, BORN + 0.3))).toFixed(3)})` : '' }
      return { x: PERCH.x, y: PERCH.y, size: OWL, phase: 'perched', facing: 1, mood: moodAt(t, moods), moodHold: true }
    },
  })

  let lastSrc = ''
  async function render(t, i) {
    // the video, frame for frame (no slowing, no freeze)
    const n = V0 + i
    const vis = n <= VLAST ? 1 - ramp(t, DIS0, DIS1) : 0
    if (n <= VLAST) {
      const src = `${heroDir}/h${String(n).padStart(3, '0')}.jpg`
      if (src !== lastSrc) {
        hero.src = src
        await hero.decode()
        lastSrc = src
      }
    }
    hero.style.opacity = String(vis)
    hero.style.display = vis > 0 ? '' : 'none'
    // the clean lockup under it: matched to the video's logo, then a gentle settle
    bg.clearRect(0, 0, 1920, 1080)
    if (!alpha) {
      paintNavy(bg, 1920, 1080)
      paintMotes(bg, t, { n: 60, seed: 14, alpha: 0.75 * ramp(t, DIS0, SETTLE1), drift: 8 })
    }
    const [s0, l0, t0] = fitAt(Math.min(n, VLAST))
    const k = easeInOut(lin(t, DIS1 - 0.1, SETTLE1))
    const s = lerp(s0, FINAL.s, k)
    const L = lerp(l0, FINAL.left, k)
    const Tp = lerp(t0, FINAL.top, k)
    $('lockup').style.transform = `translate(${L.toFixed(2)}px, ${Tp.toFixed(2)}px) scale(${s.toFixed(5)})`
    $('clean').style.opacity = String(ramp(t, DIS0 - 0.1, DIS1))
    owl.seek(t)
  }
  return {
    sec: vo.sceneSec,
    render,
    dbg: () => ({ owl: owl.state }),
    meta: { scene: 'c0_meet', voSource: vo.source, voFingerprint: vo.fingerprint, voDuration: vo.dur, estimated: vo.estimated, video: { file: 'assets/hero-v3-1080.mp4', firstFrame: V0, lastFrame: VLAST, startSec: V0 / FPS }, beats: { ...T, born: BORN, dissolve: [DIS0, DIS1], land: LAND, hello: LAND + 0.45 } },
  }
})
</script>
</body>
</html>
